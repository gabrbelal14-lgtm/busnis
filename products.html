<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنتجات</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-navy: #1a2a3a;
            --accent-red: #d9534f;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            color: var(--primary-navy);
            border-bottom: 3px solid var(--accent-red);
            padding-bottom: 10px;
            display: inline-block;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--primary-navy);
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-navy);
        }

        .btn-submit {
            grid-column: 1 / -1;
            background-color: var(--primary-navy);
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #0f1a26;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: right;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-navy);
            color: #ffffff;
        }

        tr:nth-child(even) {
            background-color: #f9fbfd;
        }

        .status-msg {
            margin-top: 10px;
            font-weight: bold;
            color: var(--accent-red);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>إدارة المنتجات</h1>

    <!-- نموذج إضافة منتج -->
    <div class="card">
        <h2>➕ إضافة منتج جديد</h2>
        <form id="productForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="productName">اسم المنتج</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label for="productCode">كود المنتج</label>
                    <input type="text" id="productCode" required>
                </div>
                <div class="form-group">
                    <label for="productPrice">السعر</label>
                    <input type="number" id="productPrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="productQty">الكمية</label>
                    <input type="number" id="productQty" required>
                </div>
                <div class="form-group">
                    <label for="productCategory">التصنيف</label>
                    <input type="text" id="productCategory" required>
                </div>
                <div class="form-group">
                    <label for="productDate">تاريخ الإضافة</label>
                    <input type="date" id="productDate" required>
                </div>
                <button type="submit" class="btn-submit">حفظ المنتج</button>
            </div>
        </form>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- جدول عرض المنتجات -->
    <div class="card">
        <h2>قائمة المنتجات</h2>
        <table>
            <thead>
                <tr>
                    <th>كود المنتج</th>
                    <th>اسم المنتج</th>
                    <th>التصنيف</th>
                    <th>السعر</th>
                    <th>الكمية</th>
                    <th>تاريخ الإضافة</th>
                </tr>
            </thead>
            <tbody id="productsTableBody">
                <!-- سيتم إضافة المنتجات ديناميكيًا عبر JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // رابط Web App الخاص بـ Google Apps Script (يتم استبداله بعد النشر)
    const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

    const productForm = document.getElementById('productForm');
    const tableBody = document.getElementById('productsTableBody');
    const statusMsg = document.getElementById('statusMsg');

    // ضبط تاريخ اليوم بشكل افتراضي في مدخل التاريخ
    document.getElementById('productDate').valueAsDate = new Date();

    // 1. استقبال البيانات عند ضغط "حفظ"
    productForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const productData = {
            action: 'addProduct',
            code: document.getElementById('productCode').value,
            name: document.getElementById('productName').value,
            category: document.getElementById('productCategory').value,
            price: parseFloat(document.getElementById('productPrice').value),
            quantity: parseInt(document.getElementById('productQty').value),
            date: document.getElementById('productDate').value
        };

        // إضافته محليًا في الجدول مباشرة لسرعة الاستجابة
        renderProductRow(productData);

        // إرسال البيانات إلى Google Sheets
        sendDataToSheet(productData);

        // إعادة تصفير النموذج
        productForm.reset();
        document.getElementById('productDate').valueAsDate = new Date();
    });

    // 2. إضافه صف جديد إلى الجدول في الصفحة
    function renderProductRow(product) {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${product.code}</td>
            <td>${product.name}</td>
            <td>${product.category}</td>
            <td>${product.price}</td>
            <td>${product.quantity}</td>
            <td>${product.date}</td>
        `;
        tableBody.appendChild(row);
    }

    // 3. إرسال البيانات إلى Google Apps Script عبر POST
    function sendDataToSheet(data) {
        statusMsg.style.color = '#1a2a3a';
        statusMsg.textContent = 'جاري حفظ البيانات...';

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(() => {
            statusMsg.style.color = 'green';
            statusMsg.textContent = 'تم حفظ المنتج بنجاح!';
            setTimeout(() => statusMsg.textContent = '', 3000);
        })
        .catch(error => {
            console.error('Error:', error);
            statusMsg.style.color = 'var(--accent-red)';
            statusMsg.textContent = 'حدث خطأ أثناء الحفظ.';
        });
    }

    // 4. جلب البيانات من Google Sheets عند فتح الصفحة (GET)
    function fetchProducts() {
        if (SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') return;

        fetch(`${SCRIPT_URL}?action=getProducts`)
            .then(res => res.json())
            .then(products => {
                tableBody.innerHTML = '';
                products.forEach(product => renderProductRow(product));
            })
            .catch(err => console.error('Error loading products:', err));
    }

    // استدعاء جلب البيانات فور تحميل الصفحة
    window.onload = fetchProducts;
</script>

</body>
</html>
