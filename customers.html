<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العملاء</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-navy: #1a2a3a;
            --accent-red: #d9534f;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            color: var(--primary-navy);
            border-bottom: 3px solid var(--accent-red);
            padding-bottom: 10px;
            display: inline-block;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--primary-navy);
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-navy);
        }

        .btn-submit {
            grid-column: 1 / -1;
            background-color: var(--primary-navy);
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #0f1a26;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: right;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-navy);
            color: #ffffff;
        }

        tr:nth-child(even) {
            background-color: #f9fbfd;
        }

        .status-msg {
            margin-top: 10px;
            font-weight: bold;
            color: var(--accent-red);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>إدارة العملاء</h1>

    <!-- نموذج إضافة عميل -->
    <div class="card">
        <h2>👤 إضافة عميل جديد</h2>
        <form id="customerForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="customerCode">كود العميل</label>
                    <input type="text" id="customerCode" placeholder="CUS-101" required>
                </div>
                <div class="form-group">
                    <label for="customerName">اسم العميل</label>
                    <input type="text" id="customerName" required>
                </div>
                <div class="form-group">
                    <label for="customerPhone">رقم الهاتف</label>
                    <input type="tel" id="customerPhone" required>
                </div>
                <div class="form-group">
                    <label for="customerEmail">البريد الإلكتروني</label>
                    <input type="email" id="customerEmail">
                </div>
                <div class="form-group">
                    <label for="customerCity">المحافظة / المدينة</label>
                    <input type="text" id="customerCity" required>
                </div>
                <div class="form-group">
                    <label for="customerDate">تاريخ التسجيل</label>
                    <input type="date" id="customerDate" required>
                </div>
                <button type="submit" class="btn-submit">حفظ العميل</button>
            </div>
        </form>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- جدول عرض العملاء -->
    <div class="card">
        <h2>قائمة العملاء</h2>
        <table>
            <thead>
                <tr>
                    <th>كود العميل</th>
                    <th>اسم العميل</th>
                    <th>رقم الهاتف</th>
                    <th>البريد الإلكتروني</th>
                    <th>المدينة</th>
                    <th>تاريخ التسجيل</th>
                </tr>
            </thead>
            <tbody id="customersTableBody">
                <!-- سيتم إضافة العملاء ديناميكيًا عبر JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // رابط Web App الخاص بـ Google Apps Script
    const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

    const customerForm = document.getElementById('customerForm');
    const tableBody = document.getElementById('customersTableBody');
    const statusMsg = document.getElementById('statusMsg');

    // ضبط تاريخ اليوم بشكل افتراضي
    document.getElementById('customerDate').valueAsDate = new Date();

    // 1. استقبال البيانات عند ضغط "حفظ"
    customerForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const customerData = {
            action: 'addCustomer',
            code: document.getElementById('customerCode').value,
            name: document.getElementById('customerName').value,
            phone: document.getElementById('customerPhone').value,
            email: document.getElementById('customerEmail').value || '-',
            city: document.getElementById('customerCity').value,
            date: document.getElementById('customerDate').value
        };

        // إضافته محليًا في الجدول مباشرة لسرعة الاستجابة
        renderCustomerRow(customerData);

        // إرسال البيانات إلى Google Sheets
        sendDataToSheet(customerData);

        // إعادة تصفير النموذج
        customerForm.reset();
        document.getElementById('customerDate').valueAsDate = new Date();
    });

    // 2. إضافة صف جديد إلى الجدول في الصفحة
    function renderCustomerRow(customer) {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${customer.code}</td>
            <td>${customer.name}</td>
            <td>${customer.phone}</td>
            <td>${customer.email}</td>
            <td>${customer.city}</td>
            <td>${customer.date}</td>
        `;
        tableBody.appendChild(row);
    }

    // 3. إرسال البيانات إلى Google Apps Script عبر POST
    function sendDataToSheet(data) {
        statusMsg.style.color = '#1a2a3a';
        statusMsg.textContent = 'جاري حفظ البيانات...';

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(() => {
            statusMsg.style.color = 'green';
            statusMsg.textContent = 'تم حفظ العميل بنجاح!';
            setTimeout(() => statusMsg.textContent = '', 3000);
        })
        .catch(error => {
            console.error('Error:', error);
            statusMsg.style.color = 'var(--accent-red)';
            statusMsg.textContent = 'حدث خطأ أثناء الحفظ.';
        });
    }

    // 4. جلب البيانات من Google Sheets عند فتح الصفحة (GET)
    function fetchCustomers() {
        if (SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') return;

        fetch(`${SCRIPT_URL}?action=getCustomers`)
            .then(res => res.json())
            .then(customers => {
                tableBody.innerHTML = '';
                customers.forEach(customer => renderCustomerRow(customer));
            })
            .catch(err => console.error('Error loading customers:', err));
    }

    // استدعاء جلب البيانات فور تحميل الصفحة
    window.onload = fetchCustomers;
</script>

</body>
</html>
